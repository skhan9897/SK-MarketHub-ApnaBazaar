spring.application.name=SK-MarketHub
server.port=8080

# Database Connection (MySQL on Port 3307)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/sk_markethub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skmarket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ChangeThis_User_2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Kafka Configuration Fallbacks
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.missing-topics-fatal=false

# Mail Configuration Fallbacks
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT Configuration
app.jwt.issuer=sk-markethub
app.jwt.expiration-ms=86400000
app.jwt.secret=${SK_MARKETHUB_JWT_SECRET:c2stbWFya2V0aHViLXNlY3JldC1qd3Qta2V5LTIwMjYtc2VjdXJlLXNlY3JldC1rZXk=}
