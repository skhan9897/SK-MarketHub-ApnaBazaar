spring.application.name=SK-MarketHub
server.port=8080

# Database Connection (Default H2 MySQL-Mode Fallback for Cloud/Render without external DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sk_markethub_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Kafka Configuration Fallbacks
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.missing-topics-fatal=false

# Mail Configuration (SMTP Gmail / Custom SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:notifications.skmarkethub@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT Configuration
app.jwt.issuer=sk-markethub
app.jwt.expiration-ms=86400000
app.jwt.secret=${SK_MARKETHUB_JWT_SECRET:c2stbWFya2V0aHViLXNlY3JldC1qd3Qta2V5LTIwMjYtc2VjdXJlLXNlY3JldC1rZXk=}
