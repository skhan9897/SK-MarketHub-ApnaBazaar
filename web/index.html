<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Brand SEO Title & Description -->
    <title>SK-MarketHub - Shop Smart. Live Better.</title>
    <meta name="description" content="SK-MarketHub Official E-Commerce Store. Shop Smart. Live Better. Buy top smartphones, electronics, fashion, home appliances with verified sellers and express delivery." />
    <meta name="keywords" content="SK-MarketHub, SK MarketHub, SK Market, ApnaBazaar, Shop Smart Live Better, Online Shopping, E-Commerce" />
    <meta name="author" content="SK-MarketHub" />

    <!-- Google Search Console Site Verification -->
    <meta name="google-site-verification" content="google-site-verification-skmarkethub" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sk-markethub-apnabazaar.onrender.com/" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SK-MarketHub" />
    <meta property="og:title" content="SK-MarketHub - Shop Smart. Live Better." />
    <meta property="og:description" content="Official SK-MarketHub E-Commerce Store. Buy genuine products with instant delivery and secure payments." />
    <meta property="og:url" content="https://sk-markethub-apnabazaar.onrender.com/" />

    <!-- Schema.org Organization & Store JSON-LD for Google Brand Indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "SK-MarketHub",
        "alternateName": ["SK MarketHub", "SK Market", "SK-MarketHub E-Commerce"],
        "url": "https://sk-markethub-apnabazaar.onrender.com/",
        "logo": "https://sk-markethub-apnabazaar.onrender.com/favicon.svg",
        "slogan": "SHOP SMART. LIVE BETTER.",
        "description": "Official SK-MarketHub E-Commerce Marketplace platform providing verified electronics, smartphones, fashion, and home appliances.",
        "sameAs": [
          "https://github.com/skhan9897/SK-MarketHub-ApnaBazaar"
        ],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://sk-markethub-apnabazaar.onrender.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
