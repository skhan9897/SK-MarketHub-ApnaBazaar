<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SK-MarketHub - Shop Smart. Live Better.</title>
    <meta name="description" content="SK-MarketHub E-Commerce Marketplace. Shop Smart. Live Better. Discover top electronics, fashion, home essentials, and mobile accessories with express delivery and verified sellers." />

    <!-- Google Search Console Verification Meta Tag -->
    <meta name="google-site-verification" content="google-site-verification-skmarkethub" />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SK-MarketHub - Shop Smart. Live Better." />
    <meta property="og:description" content="Official SK-MarketHub E-Commerce Marketplace. Buy genuine products with instant delivery and secure payments." />
    <meta property="og:url" content="https://skmarkethub.duckdns.org/" />

    <!-- JSON-LD Structured Data for Search Engine Indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SK-MarketHub",
        "alternateName": "SK MarketHub",
        "url": "https://skmarkethub.duckdns.org/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://skmarkethub.duckdns.org/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
